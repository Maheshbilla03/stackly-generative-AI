<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-box small-box">
    <img src="img.1.jpg" class="logo" alt="Stackly Logo">

    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email">
      <small id="loginEmailError"></small>

      <input type="password" id="loginPassword" placeholder="Password">
      <small id="loginPasswordError"></small>

      <button type="submit" class="primary-btn">Login</button>
    </form>

    <a href="index.html" class="home-btn">Go to Home</a>

    <p>New user? <a href="sign up.html">Create Account</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
